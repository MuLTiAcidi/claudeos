[package]
name = "app"
version = "0.1.0"
description = "ClaudeOS Wolf Alpha — Command Center"
authors = ["ClaudeOS Team"]
license = "MIT"
repository = "https://github.com/MuLTiAcidi/claudeos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
portable-pty = "0.9"
